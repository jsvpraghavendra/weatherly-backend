server.port=${PORT:8080}
server.error.include-message=always

# CORS allowed origins (comma-separated; supports patterns such as https://*.onrender.com)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.onrender.com}

# Weather provider configuration
weather.geocoding-url=${WEATHER_GEOCODING_URL:https://geocoding-api.open-meteo.com/v1/search}
weather.forecast-url=${WEATHER_FORECAST_URL:https://api.open-meteo.com/v1/forecast}
weather.api-key=${WEATHER_API_KEY:}
weather.user-agent=${WEATHER_USER_AGENT:Weatherly/1.0 (https://github.com/jsvpraghavendra/weatherly-backend)}
weather.connect-timeout-ms=${WEATHER_CONNECT_TIMEOUT_MS:5000}
weather.read-timeout-ms=${WEATHER_READ_TIMEOUT_MS:8000}
